<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        overscroll-behavior: none;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .toast-enter-exit {
        animation: toast-in 0.5s ease-out forwards;
      }

      /* --- Seasonal Animations --- */
      @keyframes fall-drift {
        0% { transform: translate(0, -10vh) rotate(0deg); opacity: 1; }
        100% { transform: translate(var(--drift-x, 15vw), 110vh) rotate(720deg); opacity: 0; }
      }
      @keyframes rise-drift {
        0% { transform: translate(0, 110vh) scale(0.5); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(var(--drift-x, 10vw), -10vh) scale(1); opacity: 0; }
      }
      .particle {
        position: fixed;
        top: 0;
        left: 0;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        pointer-events: none;
        z-index: -1;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
    </style>

</html>
